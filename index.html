<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Studio · N°98 Maps</title>
  <!-- n98com.github.io/Etsy/ opent de N°98 Studio: exact dezelfde tool als in
       Shopify (shop.html), achter de login, met "Export print file" in stap IV.
       Bestel-links (#order=…) gaan mee. De oude volledige werkbank staat op
       workbench.html; oude ?embed=1 links gaan daar ook nog heen. -->
  <script>
    (function () {
      var q = window.location.search || '';
      var h = window.location.hash || '';
      if (/[?&]embed=1\b/.test(q)) { window.location.replace('workbench.html' + q + h); return; }
      window.location.replace('shop.html?studio=1' + h);
    })();
  </script>
  <style>body{margin:0;background:#F4F1EB}</style>
</head>
<body></body>
</html>
