name: Home renders

# Renders the homepage images (tools/home-renders/designs.json) with the real map
# engine and pushes them to the "home-renders" branch.



on:
  push:
    paths:
      - 'tools/home-renders/designs.json'
      - 'tools/home-renders/render.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        working-directory: tools/home-renders
        run: npm install --no-audit --no-fund --silent
      - name: Serve the map engine locally
        run: |
          nohup python3 -m http.server 8080 --bind 127.0.0.1 >/dev/null 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/shop.html >/dev/null && break; sleep 1; done
      - name: Render
        working-directory: tools/home-renders
        run: node render.mjs
      - name: Publish to the home-renders branch
        run: |
          cd tools/home-renders/out
          git init -q -b home-renders
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Home renders for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" home-renders
