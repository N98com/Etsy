name: Palette previews

# Renders tools/palette-previews/palettes.json on an Amsterdam example map and
# pushes the images to the "palette-previews" branch. Runs when that file
# changes; the map data needs internet, which is why this runs here.

on:
  push:
    paths:
      - 'tools/palette-previews/palettes.json'
      - 'tools/palette-previews/render.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        working-directory: tools/palette-previews
        run: npm install --no-audit --no-fund --silent
      - name: Serve the map engine locally
        run: |
          nohup python3 -m http.server 8080 --bind 127.0.0.1 >/dev/null 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/shop.html >/dev/null && break; sleep 1; done
      - name: Render
        working-directory: tools/palette-previews
        run: node render.mjs
      - name: Publish to the palette-previews branch
        run: |
          cd tools/palette-previews/out
          git init -q -b palette-previews
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Palette previews for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" palette-previews
