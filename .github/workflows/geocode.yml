name: Geocode

# Looks up coordinates for the place names in tools/seo/<dir>/geocode-in.json ([{slug, q, cc}])
# via Nominatim (1 request per second) and commits geocode-out.json next to it (skipped if it exists).

on:
  push:
    paths:
      - 'tools/seo/*/geocode-in.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  geocode:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Geocode
        run: |
          python3 - <<'PY'
          import json, time, urllib.parse, urllib.request
          import glob, os
          for fin in glob.glob('tools/seo/*/geocode-in.json'):
            fout = fin.replace('geocode-in.json', 'geocode-out.json')
            if os.path.exists(fout): continue
            src = json.load(open(fin))
            out = {}
            for it in src:
              u = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=' + it.get('cc', 'nl') + '&q=' + urllib.parse.quote(it['q'])
              req = urllib.request.Request(u, headers={'User-Agent': 'N98Maps/1.0 (https://n98maps.com)'})
              try:
                  j = json.load(urllib.request.urlopen(req, timeout=30))
                  out[it['slug']] = {'lat': float(j[0]['lat']), 'lon': float(j[0]['lon']), 'display': j[0]['display_name'], 'type': j[0].get('addresstype')} if j else {'error': 'none'}
              except Exception as e:
                  out[it['slug']] = {'error': str(e)}
              time.sleep(1.2)
            json.dump(out, open(fout, 'w'), ensure_ascii=False, indent=1)
            print(fin, sum('lat' in v for v in out.values()), 'of', len(out))
          PY
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add tools/seo/*/geocode-out.json
          git commit -m "Geocode results" || exit 0
          git pull --rebase -q origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
